<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>与你 · 角色动作预览</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">与你<span style="font:12px 'Microsoft YaHei';letter-spacing:2px;margin-left:18px">角色小剧场</span></div><div class="tag">无需摄像头 · 互动预览</div></header>
<main class="layout"><section class="stage" id="stage" aria-label="角色动画预览"><div class="stage-top"><i class="dot"></i><span id="sceneLabel">安静地陪着你</span></div><div class="canvas-wrap"><canvas id="character" width="1086" height="1448" aria-label="银发角色，支持眨眼、张嘴和呼吸"></canvas></div><div class="loading" id="loading">正在准备角色…</div><div class="stage-footer"><div class="pills"><button id="bust" aria-pressed="true">半身</button><button id="full" aria-pressed="false">全图</button></div><div class="pills"><button id="background">切换背景</button></div></div></section>
<aside class="panel"><div class="tag">分层动作 · V3</div><h1>让她，动起来。</h1><p class="intro">衣料随着呼吸起伏，发梢与领带轻轻跟随。<br>保持原来的姿态，安静地陪着你。</p>
<div class="section"><p class="section-title">与她互动</p><div class="gesture-grid">
<button data-motion="tilt">歪头听你说</button><button data-motion="doubleBlink">双眨眼</button><button data-motion="happy">开心回应</button><button id="sequence">轮流演示</button></div><p class="hint" id="motionStatus" role="status" aria-live="polite">选一个动作，结束后会自然回到待机。</p></div>
<div class="section"><p class="section-title">自然待机</p><label class="toggle">自然小动作<input id="idle" type="checkbox" checked></label><label class="toggle">指针跟随<input id="follow" type="checkbox"></label><label class="toggle">前后发束摆动<input id="hair" type="checkbox" checked></label><label class="toggle">自动眨眼<input id="blink" type="checkbox" checked></label><label class="toggle">胸部衣料跟随<input id="bustMotion" type="checkbox" checked></label><label class="toggle">领带与衣物跟随<input id="clothMotion" type="checkbox" checked></label><label class="toggle">轻柔呼吸<input id="breath" type="checkbox" checked></label><div class="range-label"><label for="intensity">动作幅度</label><output id="intensityValue">轻柔</output></div><input id="intensity" type="range" min="0" max="100" value="55"><div class="actions"><button id="blinkOnce">眨眼一次</button><button id="pause">暂停动作</button></div></div>
<div class="section"><p class="section-title">说话与嘴形</p><div class="range-label"><label for="mouth">手动张嘴</label><output id="mouthValue">0%</output></div><input id="mouth" type="range" min="0" max="100" value="0"><button class="wide primary" id="demo">说话演示 · 无声</button><div class="actions"><button id="upload">导入音频</button><button id="stop" disabled>停止播放</button></div><input id="audioFile" type="file" accept="audio/*" hidden><div class="meter"><span id="level"></span></div><div id="status" role="status" aria-live="polite">准备就绪，可以开始测试。</div><p class="hint">音频仅在本机播放，嘴形随音量变化；不会上传文件，也不会启用麦克风。</p></div>
<div class="section"><label class="toggle">查看变形网格<input id="meshDebug" type="checkbox"></label><p class="hint" id="rigInfo">正在加载分层素材…</p></div><button class="wide" id="reset">恢复默认</button><p class="footnote">网页动画原型 · 使用独立部件网格、遮挡补画与弹簧跟随。<br>尚未制作 Cubism 模型绑定，不是 .moc3 成品。</p></aside></main>
<script src="motion.js?v=3"></script><script src="rig.js?v=3"></script><script src="rig-assets.js?v=3"></script><script src="mesh-renderer.js?v=3"></script><script src="app.js?v=3"></script></body></html>
